<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Sales Invoice Created</title>
</head>
<body style="font-family: Arial, sans-serif; color: #111827; line-height: 1.5;">
    <p>Hi {{Name}},</p>
    <p>Your GearVault sales invoice <strong>{{InvoiceNumber}}</strong> has been created.</p>
    <table style="border-collapse: collapse; width: 100%; max-width: 520px;">
        <tr><td style="padding: 6px 0;">Invoice date</td><td style="padding: 6px 0; text-align: right;">{{InvoiceDate}}</td></tr>
        <tr><td style="padding: 6px 0;">Subtotal</td><td style="padding: 6px 0; text-align: right;">Rs. {{SubTotal}}</td></tr>
        <tr><td style="padding: 6px 0;">Discount</td><td style="padding: 6px 0; text-align: right;">Rs. {{DiscountAmount}}</td></tr>
        <tr><td style="padding: 6px 0; font-weight: bold;">Total</td><td style="padding: 6px 0; text-align: right; font-weight: bold;">Rs. {{TotalAmount}}</td></tr>
        <tr><td style="padding: 6px 0;">Balance due</td><td style="padding: 6px 0; text-align: right;">Rs. {{BalanceDue}}</td></tr>
    </table>
    <p>Thank you for choosing GearVault.</p>
    <p style="color: #6b7280; font-size: 12px;">&copy; {{CurrentYear}} GearVault</p>
</body>
</html>
